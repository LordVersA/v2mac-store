# Checks each submission a pull request adds or changes and comments the report (plan §7 "Submission").
name: Submission check
on:
  pull_request:
    paths: ["submissions/**"]
permissions: { pull-requests: write, contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The checker and bases.json come from the base branch: a PR can't change what judges it.
      - uses: actions/checkout@v4
        with: { ref: "${{ github.base_ref }}", path: base }
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          python3 base/Scripts/check-submission.py --selftest
          status=0
          : > report.md
          for f in $(git diff --name-only --diff-filter=AM origin/${{ github.base_ref }}...HEAD -- submissions/); do
            python3 base/Scripts/check-submission.py "$f" >> report.md || status=1
            echo >> report.md
          done
          gh pr comment ${{ github.event.pull_request.number }} --body-file report.md
          exit $status
